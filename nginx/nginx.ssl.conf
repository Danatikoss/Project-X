# nginx.ssl.conf — HTTPS (use after certbot has issued a certificate)
# To activate: cp nginx/nginx.ssl.conf nginx/nginx.conf && docker compose restart nginx

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name slidex-ai.com www.slidex-ai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name slidex-ai.com www.slidex-ai.com;

    ssl_certificate     /etc/letsencrypt/live/slidex-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slidex-ai.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://slidex-ai.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

    # Auth rate limiting (10 req/min per IP)
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 520M;
        proxy_read_timeout 300s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Static files served by backend
    location /thumbnails/ {
        proxy_pass http://backend;
        add_header Cache-Control "public, max-age=604800";
    }
    location /exports/ {
        proxy_pass http://backend;
    }
    location /media-files/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        client_max_body_size 520M;
        proxy_read_timeout 300s;
        add_header Cache-Control "public, max-age=86400";
        add_header Accept-Ranges bytes;
    }
    location /brand-backgrounds/ {
        proxy_pass http://backend;
        add_header Cache-Control "public, max-age=604800";
    }
    location /feedback-attachments/ {
        proxy_pass http://backend;
    }

    # Frontend (React SPA)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
    }
}
